[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owbatch"
version = "0.1.0"
description = "Data-driven batch CLI for OpenWind frequency-domain studies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Chenweichu" },
]
dependencies = [
  "matplotlib>=3.7",
  "mplcursors>=0.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
owbatch = "owbatch.cli:main"
owbatch-plot-impedance = "visulization.plot_impedance:main"
owbatch-plot-analysis = "visulization.plot_analysis:main"
owbatch-view-analysis = "visulization.view_analysis:main"
owbatch-dashboard = "visulization.study_dashboard:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
